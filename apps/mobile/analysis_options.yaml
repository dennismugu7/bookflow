# Dart and Flutter static analysis.
#
# Baseline is flutter_lints, then tightened. The tightening mirrors what
# apps/api/tsconfig.json does on the TypeScript side (ADR-022): an explicit,
# auditable list of strictness settings rather than a third-party preset, so
# every rule here can be traced to a reason rather than to someone else's
# taste. That symmetry is the point — one project, two languages, comparable
# guarantees.
#
# Run with `flutter analyze --fatal-infos --fatal-warnings`. Without
# --fatal-infos, every lint below reports as an "info" and exits zero, which
# would make this file decorative.

include: package:flutter_lints/flutter.yaml

analyzer:
  # The three strict language modes. These are the closest Dart equivalent of
  # `strict: true` in tsconfig, and none is on by default.
  language:
    strict-casts: true # no silent downcast from dynamic
    strict-inference: true # no type inferred as dynamic by omission
    strict-raw-types: true # no bare List/Map/Future without type arguments

  errors:
    # Promoted from warning to error: each is a latent bug, not a style point.
    invalid_annotation_target: error
    missing_required_param: error
    missing_return: error
    body_might_complete_normally_nullable: error
    unused_import: error
    unused_local_variable: error
    dead_code: error
    # A TODO is a note to a future reader, not a build failure.
    todo: ignore

  exclude:
    # Generated by the platform toolchains. The API client is no longer listed
    # here: it is its own package under packages/bookflow_api and is not part
    # of this analysis root at all (ADR-025 amendment).
    - build/**
    - '**/*.g.dart'
    - '**/*.freezed.dart'

linter:
  rules:
    # ── Types and returns ────────────────────────────────────────────────────
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_type_to_string: true

    # ── Async correctness. The class of bug that survives review. ────────────
    unawaited_futures: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    discarded_futures: true
    unnecessary_await_in_return: true

    # ── Immutability by default ──────────────────────────────────────────────
    prefer_final_locals: true
    prefer_final_in_for_each: true

    # ── Imports. `always_use_package_imports` keeps a file's identity stable
    #    however deep the module tree gets — relative imports of the same file
    #    from two directories are two libraries to the analyzer.
    always_use_package_imports: true
    depend_on_referenced_packages: true
    directives_ordering: true

    # ── Style, aligned with the TypeScript side so the two read alike ────────
    prefer_single_quotes: true
    require_trailing_commas: true
    use_super_parameters: true

    # ── Things that are almost always mistakes ───────────────────────────────
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    throw_in_finally: true
    test_types_in_equals: true
    unnecessary_statements: true
    unnecessary_parenthesis: true
    use_build_context_synchronously: true
