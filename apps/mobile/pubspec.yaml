name: bookflow
description: "Bookflow owner app — Flutter (ADR-015). Skeleton; screens are Phase 3."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The generated API client, as the package it is (ADR-014, ADR-025).
  # Its own pubspec carries dio, built_value and the rest — nothing is
  # mirrored here, so a generator upgrade cannot silently change what this
  # app depends on without the drift check seeing it.
  bookflow_api:
    path: ../../packages/bookflow_api

  # Used directly by this package: the app configures the Dio instance it
  # hands to the generated client, and the client test stubs its adapter.
  dio: ^5.7.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  supabase_flutter: ^2.17.2
  flutter_secure_storage: ^11.0.0
  share_plus: ^13.3.0
  built_collection: ^5.1.1
  image_picker: ^1.2.3

  # Hands a URI to the operating system. Three uses, all of them things this
  # app should not try to be: `mailto:` and `tel:` from the contacts list
  # (screen #8 specifies both), and opening a payment proof's signed URL in the
  # browser when the in-app image view cannot render it — a proof may be a PDF,
  # and `Image.network` would show a broken box rather than say so.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The e2e harness, and the only thing that satisfies DEFINITION_OF_DONE's
  # e2e item (ADR-033: "an API integration test is not an e2e test, however
  # end-to-end it feels"). Drives a real build on a real device against
  # DEPLOYED staging — see integration_test/README.md.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # ── BUILD-TIME GENERATORS, NOT RUNTIME DEPENDENCIES ──────────────────────
  #
  # Both write native project files (Android resources, manifests, styles) and
  # are never imported by Dart. `dev_dependencies` is where they belong: they
  # must not ship in the app, and nothing at runtime can call them.
  #
  # Their OUTPUT is committed — see the `flutter_launcher_icons` and
  # `flutter_native_splash` sections at the foot of this file for why.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# ══ LAUNCHER ICON ═══════════════════════════════════════════════════════════
#
# ANDROID ONLY. ADR-043 removed the iOS build entirely — there is no `ios/`
# target to generate into, and asking for one produces a directory nobody
# builds.
#
# ── ADAPTIVE, WITH A LEGACY FALLBACK ───────────────────────────────────────
#
# Android 8+ composes an adaptive icon from a foreground layer over a
# background, and masks the result to whatever shape the launcher uses — circle,
# squircle, teardrop. The foreground art must therefore survive being cropped:
# `adaptive_foreground_monogram.png` is the monogram with the margin that
# expects, which is why it is a different file from the square icon below.
#
# `image_path` is that square icon and is the fallback for launchers and Android
# versions that do not do adaptive. Dropping it would leave those with nothing.
#
# The background is flat #372D87 rather than the hero gradient: an adaptive
# background is a single drawable that the launcher may parallax independently
# of the foreground, and a gradient sliding under a static monogram looks like a
# rendering fault.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/icon_monogram_1024.png
  adaptive_icon_background: "#372D87"
  adaptive_icon_foreground: assets/branding/adaptive_foreground_monogram.png

# ══ NATIVE SPLASH ═══════════════════════════════════════════════════════════
#
# ══ IT EXISTS TO MAKE THE HANDOVER INVISIBLE ════════════════════════════════
#
# `startup_screen.dart` is a Dart splash and CANNOT appear until the Flutter
# engine has booted. Before this, the gap was filled by the platform default —
# a white screen. So a cold launch was: white, then a sudden indigo gradient.
# That flash reads as a bug in the app rather than as the engine starting.
#
# The native splash paints #372D87 with the same mark, so the two are visually
# continuous and the moment the engine takes over is not a visible event.
#
# ── WHY A FLAT COLOUR WHERE THE DART SPLASH HAS A GRADIENT ─────────────────
#
# A native splash background is a single colour on Android; it cannot be a
# gradient without shipping a drawable that then has to be kept in step with
# `BookflowTheme.heroGradient` by hand. #372D87 sits between the gradient's two
# stops (#231973 → #3D2C8F), so the transition is a shift in shading rather than
# a change of colour.
#
# ── ANDROID 12 NEEDS ITS OWN ENTRY, AND IGNORING IT IS VISIBLE ─────────────
#
# Android 12 replaced the old splash mechanism with a system one that masks the
# icon into a circle and draws it at a fixed size. A logo drawn for the old
# behaviour gets cropped by that mask, which is why
# `splash_android12_logo.png` is a separate, more generously-margined file. The
# background is repeated here because the android_12 block does not inherit it.
flutter_native_splash:
  color: "#372D87"
  image: assets/branding/splash_logo.png
  android: true
  ios: false
  web: false

  android_12:
    color: "#372D87"
    image: assets/branding/splash_android12_logo.png
