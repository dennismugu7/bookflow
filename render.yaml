# Render Blueprint — staging (ADR-024 as amended 2026-08-15, ADR-034).
#
# ══ WHAT THIS FILE IS, AND WHAT IT DELIBERATELY IS NOT ══════════════════════
#
# It declares TWO services: the Bookflow API, built from apps/api/Dockerfile,
# and the client booking site as a static site. Both on free instance types.
#
# ── THERE IS NO WORKER SERVICE, AND THAT IS A DECISION ──────────────────────
#
# ADR-013 requires a Node worker for the transactional outbox and booking
# expiry, running from the same image as the API and sharing its service layer.
# It is absent here for two independent reasons, either of which alone is
# sufficient:
#
#   1. **It does not exist yet.** ADR-027 resolved K60: the outbox and its
#      worker do not ship in Phase 3. No domain email exists until the booking
#      slice, because no domain record exists that anyone needs telling about.
#
#   2. **Render's free instance type cannot run it.** Free is available for web
#      services, Postgres, Key Value and static sites; background workers and
#      private services are not among them (Render docs, "Deploy for Free",
#      read 2026-08-15). A worker on Render is a paid instance.
#
# **So its absence is a decision with a trigger, not an omission.** The worker
# arrives with the booking slice, and that is the moment this platform choice is
# re-examined — see the 2026-08-15 amendment to ADR-024, which names exactly
# that event as the revisit trigger.
#
# ── AUTO-DEPLOY IS OFF, DELIBERATELY. DO NOT TURN IT ON ─────────────────────
#
# See the long note on `autoDeployTrigger` below. The short version: deploys are
# PULLED by CI after migrations have run, not PUSHED by Render on commit.

services:
  - type: web
    name: bookflow-api-staging
    runtime: docker

    # Free: 512MB RAM, 0.1 CPU, sleeps after 15 minutes without inbound traffic
    # and takes about a minute to wake. ADR-034's "free tiers only" holds, and
    # the amendment to ADR-024 records what that costs — a smoke test pays the
    # cold start, and this instance type would be indefensible for production.
    plan: free

    # Frankfurt. The staging Supabase project is `eu-central-1`
    # (docs/ENVIRONMENT.md §3), and Frankfurt IS eu-central-1 — so the API sits
    # in the same region as its database rather than crossing the Atlantic on
    # every query. Render's five regions are oregon, ohio, virginia, frankfurt
    # and singapore.
    #
    # **Confirm this is offered on the free instance type when you create the
    # service.** Render's regions documentation does not state that free is
    # restricted to a subset, and it does not state that it is not — the page
    # is silent either way, read 2026-08-15. If the dashboard refuses frankfurt
    # on free, that is a finding worth recording rather than quietly switching
    # to oregon: it would put every database round trip across an ocean.
    region: frankfurt

    dockerfilePath: ./apps/api/Dockerfile
    # The repository root, because the build is an npm-workspace install and
    # needs the root lockfile and every member's manifest (ADR-022).
    dockerContext: .

    # `/health` is the one unauthenticated route (ADR-014 amendment: probes sit
    # outside the versioned surface). It answers without touching the database,
    # which is what makes it a liveness probe rather than a dependency check.
    healthCheckPath: /health

    # ── THE PART THAT MATTERS ────────────────────────────────────────────────
    #
    # `off` — Render must NOT deploy when a commit lands. The valid values are
    # `commit`, `checksPass` and `off`; the default is `commit`.
    #
    # **Why this is not a preference.** ADR-034 requires migrations to be
    # applied by CI, on merge to `main`, BEFORE the deploy. Render deploying on
    # its own commit hook would race that job: the new image would go live
    # against whatever schema happened to be there, which for anything but an
    # additive migration is a guaranteed window of errors. The ordering is the
    # entire point of ADR-034's decision, and it can only be guaranteed by one
    # system doing both things in sequence.
    #
    # `checksPass` is not sufficient either. It waits for CI to be green, but
    # "green" includes runs on other branches and says nothing about whether
    # THIS commit's migration reached staging.
    #
    # **So the deploy is pulled, not pushed**: `.github/workflows/ci.yml` posts
    # to Render's deploys API after `migrate-staging` succeeds, then polls the
    # same API until the deploy is `live` or has failed. **No deploy hook is
    # used** — the API key it must hold anyway to read the outcome can also
    # trigger, so a hook would be a second bearer credential doing half a job.
    # If you are here because deploys "stopped working", the fix is in that
    # workflow, not in this line.
    #
    # **Quoted deliberately.** Unquoted `off` is a boolean in YAML 1.1 — it
    # parses as `false`, not as the string this field expects. Whether Render's
    # parser is 1.1 or 1.2 decides whether that is an error or a silently wrong
    # value, and this is not a field to find out the hard way: the wrong answer
    # is auto-deploy staying on, which is the exact race this setting prevents.
    autoDeployTrigger: 'off'

    envVars:
      # ── DECLARED BY NAME, VALUES SET IN THE DASHBOARD ────────────────────
      #
      # `sync: false` means Render does not take a value from this file and does
      # not overwrite what is set in the dashboard. The names are therefore
      # reviewable in the repository — a reader can see exactly what this
      # service is given — while no value is ever committed (ADR-023, and
      # CLAUDE.md §5: no credential is ever committed, including in examples).
      #
      # Every name here appears in `.env.example` with its shape and where to
      # obtain it.

      - key: APP_ENV
        sync: false # `staging`. Not a secret; kept here for uniformity.

      # ── THE APPLICATION ROLE, NOT postgres (ADR-038) ─────────────────────
      #
      # This is the `bookflow_api` connection: CRUD, no DDL, no ownership, with
      # BYPASSRLS so that RLS-with-no-policies does not lock it out of its own
      # tables. **It must never be the `postgres` connection string.** The
      # privileged credential exists in exactly one place — the
      # `STAGING_DATABASE_URL` Actions secret used by the migrate job — and a
      # deployed API holding DDL rights over its own schema is the thing ADR-038
      # was written to prevent.
      #
      # Actions already holds this same value as `STAGING_APP_DATABASE_URL`
      # (docs/ENVIRONMENT.md §3). It is set here separately rather than shared,
      # because the two systems have no channel between them and should not.
      - key: DATABASE_URL
        sync: false

      # NOT SET, deliberately: `ADMIN_DATABASE_URL`. `platform/config.ts` makes
      # it optional precisely so a deployed API can be without it, and its
      # absence in staging and production is the point rather than an oversight.

      # ── SUPABASE (ADR-017, ADR-037) ──────────────────────────────────────
      - key: SUPABASE_URL
        sync: false # https://vvborjxraxdeflrllqwh.supabase.co — the ref is not a secret

      - key: SUPABASE_ANON_KEY
        sync: false # publishable; used for the /resend call (spike 002 L6)

      # BYPASSES RLS ENTIRELY (spike 001/C7). Required since ADR-037: the
      # endpoint creates and deletes GoTrue users with it, and the compensating
      # delete needs it too. Never in the Flutter app, never in a log.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # ── NOT SET YET ──────────────────────────────────────────────────────
      # MAIL_PROVIDER_API_KEY and MAIL_FROM_ADDRESS stay unset: ADR-027 puts
      # auth email inside GoTrue, and the outbox that would need a provider does
      # not ship in Phase 3. Both are optional in `platform/config.ts`, so the
      # service starts without them.
      #
      # **PUBLIC_WEB_ORIGIN also stays unset, and now for a different reason.**
      # It was "until apps/web exists". It exists — see below — and the API
      # still does not need to know its origin: CORS on `/v1/public/*` allows
      # ANY origin, because a published salon page is public data by
      # construction (ADR-004, ADR-020) and pinning one origin would break the
      # salon's own page the day it moves to a custom domain. If the API ever
      # needs to BUILD a web URL — an email linking a client to their booking —
      # that is when this gets set.

  # ── The client booking site ────────────────────────────────────────────────
  #
  # A static site: HTML, CSS and one JS bundle, with no server of its own. It
  # reads the API cross-origin from the browser, which is what `@fastify/cors`
  # in `apps/api/src/app.ts` exists for.
  #
  # ── FREE HERE IS NOT THE COMPROMISE IT IS FOR THE API ────────────────────
  #
  # Render's free web services sleep after 15 minutes and take about a minute to
  # wake, which is why the API's `plan: free` carries an apology. **Static sites
  # do not sleep** — they are served from a CDN — so this one is fast on a cold
  # visit, which matters more here than anywhere else in the system: this page is
  # opened from a WhatsApp link by someone deciding whether to book.
  #
  # The API behind it still sleeps, so the FIRST salon page load after a quiet
  # period waits on that cold start. That is the API's problem and is recorded
  # against it, not worked around here with a keep-alive ping.
  - type: web
    name: bookflow-staging-web
    runtime: static

    # Same region as the API and the database. A static site is CDN-served so
    # the region matters less, but there is no reason to choose differently.
    region: frankfurt

    # Built from the repository root: this is an npm workspace, so the install
    # needs the root lockfile and every member's manifest (ADR-022). `npm ci`
    # rather than `install`, for the reason CI gives — the lockfile is
    # authoritative and a build must never resolve a tree nobody reviewed.
    buildCommand: npm ci && npm run web:build
    staticPublishPath: ./apps/web/dist

    # ── AUTO-DEPLOY IS OFF HERE TOO, FOR A WEAKER REASON ────────────────────
    #
    # The API's `off` is load-bearing: ADR-034 requires migrations to run before
    # the deploy, and a Render commit hook would race that. A static site has no
    # migration to race.
    #
    # It is still off, so that ONE system decides what is live. With auto-deploy
    # on, a commit to main would publish a site built against an API that had
    # not been deployed yet — the new page calling an endpoint that does not
    # exist, for the minute or two between. Same quoting caveat as above:
    # unquoted `off` is boolean `false` in YAML 1.1.
    autoDeployTrigger: 'off'

    # ── THE SPA REWRITE, WITHOUT WHICH EVERY LINK 404s ──────────────────────
    #
    # Every URL this site serves is `/:handle` — and there is no `vera-salon`
    # file in `dist/`. A visitor who taps a shared link, or reloads the page, or
    # opens a bookmark, asks the CDN for a path that does not exist on disk.
    #
    # **This is not a nicety; without it the product does not work at all.** The
    # only URL that would load is `/`, which is the one nobody has.
    #
    # `rewrite`, not `redirect`: the browser must keep the URL it asked for so
    # React Router can read the handle out of it. A redirect would send everyone
    # to `/` and lose the salon.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      # ── SET HERE, NOT `sync: false`, BECAUSE IT IS NOT A SECRET ───────────
      #
      # Every other envVar in this file is `sync: false` because it is a
      # credential. This is a public origin that appears in the network tab of
      # every browser that opens a salon page.
      #
      # It is also BUILD-TIME: Vite substitutes `import.meta.env.*` into the
      # bundle, so changing it requires a rebuild rather than a restart. Written
      # here means the blueprint and the bundle cannot disagree.
      #
      # `client.ts` carries the same value as its committed default, so a build
      # with this unset still works. The duplication is deliberate — the default
      # is what a fresh clone and a local `npm run web:dev` get.
      #
      # The `-gabm` suffix is Render's own — it appends one when a service name
      # is not globally unique. **Do not "correct" this to match the `name:`
      # field above**; the deployed origin has the suffix and the tidy-looking
      # version 404s.
      - key: VITE_API_BASE_URL
        value: https://bookflow-api-staging-gabm.onrender.com
