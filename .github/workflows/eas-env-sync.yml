name: EAS env sync

# Copies the app's public Supabase values from GitHub repository variables into the EAS
# `preview` and `development` environments, which builds and updates read at bundle time.
# These are public client values (the anon key is protected by RLS), hence variables, not secrets.

on:
  workflow_dispatch:

concurrency:
  group: eas-env-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/owner
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - name: Check the repository variables
        working-directory: .
        run: |
          missing=""
          [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_ANON_KEY" ] || missing="$missing SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variable(s):$missing. Add them under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write the variables to EAS
        run: |
          for environment in preview development; do
            eas env:set "$environment" --name EXPO_PUBLIC_SUPABASE_URL --value "$SUPABASE_URL" \
              --visibility plaintext --scope project --non-interactive
            eas env:set "$environment" --name EXPO_PUBLIC_SUPABASE_ANON_KEY --value "$SUPABASE_ANON_KEY" \
              --visibility plaintext --scope project --non-interactive
          done
