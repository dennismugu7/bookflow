name: Auth config

# Sends only the auth settings Bookflow manages to the Supabase Management API.
# Every other remote setting is left untouched (a PATCH changes only the fields it names).
# Edit the field lists below to change a managed setting; supabase/config.toml is for local dev.
# Each part runs only when its secrets exist, otherwise it is skipped with a notice.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/auth-config.yml
      - supabase/templates/**
      - .github/scripts/patch-auth-config.sh
  workflow_dispatch:

concurrency:
  group: auth-config
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
      GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
    steps:
      - id: secrets
        run: |
          # Never send an empty Google config.
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_SECRET" ]; then
            echo "google=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Google secrets are not set; skipping the main auth settings."
            echo "google=false" >> "$GITHUB_OUTPUT"
          fi
          # Free-tier projects can only change email templates with a custom SMTP sender.
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then
            echo "smtp=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SMTP_USER / SMTP_PASS are not set; skipping SMTP and the email code templates."
            echo "smtp=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.google == 'true' || steps.secrets.outputs.smtp == 'true'
        uses: actions/checkout@v7

      - name: Main auth settings
        if: steps.secrets.outputs.google == 'true'
        run: |
          jq -n             --arg google_client_id "$GOOGLE_CLIENT_ID"             --arg google_secret "$GOOGLE_SECRET"             '{
              site_url: "https://bookflow-web-pearl.vercel.app",
              uri_allow_list: "http://localhost:3000/**,https://*-dennismugu7-6048s-projects.vercel.app/**",
              external_google_enabled: true,
              external_google_client_id: $google_client_id,
              external_google_secret: $google_secret,
              external_phone_enabled: false,
              mailer_otp_exp: 600,
              mailer_otp_length: 6
            }' > "$RUNNER_TEMP/auth.json"
          .github/scripts/patch-auth-config.sh "$RUNNER_TEMP/auth.json"

      # Gmail with an app password. Sent before the templates, which need a custom sender.
      - name: SMTP sender
        if: steps.secrets.outputs.smtp == 'true'
        run: |
          jq -n             --arg user "$SMTP_USER"             --arg pass "$SMTP_PASS"             '{
              smtp_host: "smtp.gmail.com",
              smtp_port: "465",
              smtp_user: $user,
              smtp_pass: $pass,
              smtp_admin_email: $user,
              smtp_sender_name: "Bookflow"
            }' > "$RUNNER_TEMP/auth.json"
          .github/scripts/patch-auth-config.sh "$RUNNER_TEMP/auth.json"

      - name: Email code templates
        if: steps.secrets.outputs.smtp == 'true'
        run: |
          jq -n             --rawfile magic_link supabase/templates/magic_link.html             --rawfile confirmation supabase/templates/confirmation.html             '{
              mailer_subjects_magic_link: "Your Bookflow code",
              mailer_subjects_confirmation: "Your Bookflow code",
              mailer_templates_magic_link_content: $magic_link,
              mailer_templates_confirmation_content: $confirmation
            }' > "$RUNNER_TEMP/auth.json"
          .github/scripts/patch-auth-config.sh "$RUNNER_TEMP/auth.json"
