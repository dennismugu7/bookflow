name: DB deploy

on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
  workflow_dispatch:

# Queue, never cancel: stopping a migration mid-way could leave the database half-migrated.
concurrency:
  group: db-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      - run: supabase link --project-ref "$PROJECT_REF"
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID }}

      # Applies only migrations missing from the remote history; the seed is never pushed.
      - run: supabase db push --yes
