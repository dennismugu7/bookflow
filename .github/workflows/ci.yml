name: CI

# ADR-024: GitHub Actions, one CI system for everything.
#
# Three independent jobs: `verify` (TypeScript), `mobile` (Dart on Linux) and
# `ios-build` (Dart on macOS). None depends on another, so one failure never
# hides another's result.
#
# Still missing from ADR-024: the contract drift check, which needs ADR-025's
# generation pipeline, and the Fly.io deploy, which belongs after there is
# something worth deploying.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the iOS job be run on demand against a branch, without paying for it
  # on every push. See the `ios` job's `if:` below.
  workflow_dispatch:

# One run per ref. Pushing twice in quick succession cancels the first, so the
# queue never fills with runs whose result nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # node-version-file, not a literal. The Node line is pinned in .nvmrc and
      # in package.json engines (ADR-022); a third copy here would be the one
      # that silently goes stale.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # ci, not install: the lockfile is authoritative and a CI run must never
      # quietly resolve a different tree than the one that was reviewed.
      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      # A real Supabase Postgres, not a stock postgres service container.
      # The schema will shortly reference Supabase's own `auth` schema, which
      # stock Postgres does not have — so the integration suite has to run
      # against the same stack it runs against locally, or it stops being
      # evidence about anything.
      #
      # Excluded services, and why: every one of these is unused by the test
      # suite, which speaks SQL to Postgres through Kysely and nothing else.
      #   postgrest     ADR-013: clients never talk to PostgREST
      #   storage-api   ADR-011's buckets are not exercised yet
      #   imgproxy      image transforms, only meaningful with storage
      #   realtime      no subscription is under test
      #   postgres-meta \
      #   studio         > the dashboard; there is nobody to look at it
      #   edge-runtime  no edge functions in this project
      #   logflare      \
      #   vector         > log shipping, pointless for a 20-second run
      #   supavisor     connection pooler; tests connect directly on 54322
      #
      # `gotrue` is deliberately NOT excluded. It owns the `auth` schema, and
      # dropping it would remove the one thing that makes this stack worth
      # starting instead of a plain Postgres container.
      #
      # `kong` is no longer excluded either, as of the auth slice. GoTrue is
      # only reachable over HTTP through the gateway, and the integration tests
      # sign the seeded user in for a real ES256 token rather than minting one
      # against keys they control (ADR-017, spike 001/C5). Excluding kong makes
      # those tests fail with a connection error that looks like a bug in the
      # API.
      #
      # `mailpit` is no longer excluded either, as of the mediated sign-up
      # slice. It was excluded on the reasoning that ADR-012 sends domain email
      # through the outbox worker — true, and beside the point: ADR-027 puts
      # AUTH email inside GoTrue, and ADR-037's mechanism ends in a real
      # `POST /resend` that GoTrue must actually deliver somewhere. With no SMTP
      # target that call fails, the endpoint compensates exactly as designed,
      # and the happy-path test fails for a reason that has nothing to do with
      # the code under test.
      #
      # `supabase start` applies everything in supabase/migrations as part of
      # bringing the database up, so the schema is in place before the suite
      # runs. The step after this one asserts that rather than assuming it.
      - name: Start Supabase (database, auth and mail)
        run: |
          supabase start \
            -x postgrest \
            -x storage-api \
            -x imgproxy \
            -x realtime \
            -x postgres-meta \
            -x studio \
            -x edge-runtime \
            -x logflare \
            -x vector \
            -x supavisor

      - name: Confirm migrations applied
        run: supabase migration list --local

      # One command, the same one DEFINITION_OF_DONE.md names. Not a re-listing
      # of lint/format/typecheck/test steps: separate steps here would be a
      # second definition of "done" that drifts from the checklist the moment
      # either changes.
      #
      # Neither value below is a secret. They are the fixed, well-known local
      # development values the Supabase CLI prints on every machine — see
      # docs/ENVIRONMENT.md §3. No repository secret is used by this workflow.
      # Two connections, per ADR-038. DATABASE_URL is the application role —
      # CRUD, no DDL — and is what apps/api actually uses. ADMIN_DATABASE_URL is
      # postgres, for the test harness alone: it creates auth.users rows and
      # switches roles, neither of which the application role can do.
      #
      # The application role's local password is set by supabase/seed.sql, which
      # `supabase start` applies. That is the only reason this works without a
      # secret — and it is the reason seed.sql must never stop being local-only.
      - name: Verify
        run: npm run verify
        env:
          APP_ENV: local
          DATABASE_URL: postgresql://bookflow_api:local_dev_password@127.0.0.1:54322/postgres
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          # The issuer and JWKS URI are derived from this (ADR-017). The anon
          # key below is the fixed local development value the CLI prints on
          # every machine — not a secret, and not a repository secret.
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          # Required as of the mediated sign-up slice (ADR-037): the API creates
          # and deletes GoTrue users with it. This is the fixed local
          # development service-role key the CLI prints on every machine — the
          # same class of value as the anon key above, and equally not a secret.
          # A hosted service-role key would never appear here; it bypasses RLS
          # entirely (spike 001/C7) and lives only in Fly/Actions secrets.
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

  # ── Mobile ─────────────────────────────────────────────────────────────────
  # Independent of `verify`. Neither job needs the other, so a Dart failure
  # does not hide a TypeScript failure, and both results arrive on the PR.
  mobile:
    name: mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle needs a JDK; the Flutter action does not supply one.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to the version on the development machine, for the same reason
      # the Supabase CLI is pinned above: CI and local should disagree because
      # someone changed a number, not because a channel moved.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # --fatal-infos matters: every lint in analysis_options.yaml reports as an
      # "info", and without this the analyzer would exit zero with a page of
      # them (ADR-022 requires zero warnings).
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Format check
        run: dart format --set-exit-if-changed lib test

      # `--exclude-tags golden` is deliberate and is not a gap in coverage.
      #
      # The one tagged test renders screen #20 to a PNG under
      # docs/designs/built/ so it can be compared BY EYE against its design. It
      # is an artefact, not an assertion: font hinting and subpixel positioning
      # differ between the Windows development machine and this runner, so a
      # byte comparison of rendered text fails here for reasons that have
      # nothing to do with the screen. The predictable response to that is
      # `--update-goldens` until the build is green, which teaches people to
      # regenerate the reference instead of looking at it.
      #
      # The screen's behaviour IS covered here — test/profile_screen_test.dart
      # asserts on widgets and text and runs in this job.
      - name: Test
        run: flutter test --exclude-tags golden

      - name: Build Android (debug)
        run: flutter build apk --debug

  # ── iOS ────────────────────────────────────────────────────────────────────
  # Proves the iOS target compiles. It cannot do more than that: there is no
  # Apple Developer account, so --no-codesign is the ceiling and signing stays
  # open as K53 in docs/analysis/05-triage.md.
  #
  # COST. macOS runners bill at 10x the Linux rate against this private
  # repository's included allowance, so this job is deliberately NOT run on
  # every push:
  #   - always on push to main, where the result matters;
  #   - on demand via workflow_dispatch;
  #   - on a pull request ONLY when it carries the `ios` label, so a PR that
  #     touches iOS can opt in and everything else pays nothing.
  ios:
    name: ios-build
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ios')
    runs-on: macos-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --no-codesign

  # ── Contract drift ─────────────────────────────────────────────────────────
  # Its own job rather than a step inside `verify`, for two reasons.
  #
  # First, it needs a different toolchain: Node to build the app, Docker to run
  # openapi-generator, and the Dart SDK to run build_runner. Folding that into
  # `verify` would make the fast pre-push gate depend on all three.
  #
  # Second, a drift failure should read as "the contract drifted", not as a
  # late step in a job named after something else. Independent jobs also mean a
  # drift failure never hides a test failure or vice versa.
  #
  # This is the job ADR-014 leans on. Without it, "the spec is generated from
  # code" and "hand-written Dart models are prohibited" are conventions rather
  # than guarantees.
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get
        working-directory: apps/mobile

      # Regenerates the spec and the Dart client, then fails if either differs
      # from what is committed — including a generated file nobody committed at
      # all. openapi-generator runs as a container; the runner already has
      # Docker, and a JDK is not part of this project's toolchain (ADR-022).
      - name: Check for contract drift
        run: npm run contracts:check

  # ── Staging migrations ─────────────────────────────────────────────────────
  # ADR-034: migrations are applied by CI on merge to `main`, before any deploy
  # step, using a scoped credential held in Actions secrets — never from a
  # development machine. ADR-023's rule that no hosted credential lives on a
  # laptop is only real if nothing requires one to be there.
  #
  # `if` is belt and braces: `on.push.branches` already restricts pushes to
  # `main`, and this additionally guarantees the job cannot fire for a
  # pull_request event. A PR must never migrate a shared database — its schema
  # would land before its code was reviewed, and against a branch that may
  # never merge.
  #
  # `needs` means a red test suite or a drifted contract stops the migration.
  # A migration is the one thing here that is not trivially reversible, so it
  # goes last among the checks and first among the changes.
  #
  # The deploy job, when it exists, will declare `needs: [migrate-staging]` so
  # that code expecting a column cannot ship before the column exists. That
  # ordering makes backward-compatible migrations a requirement rather than a
  # preference — see ADR-034.
  migrate-staging:
    name: migrate-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      # Fails the step, and so the workflow, on any migration error. The
      # connection string never appears in the log: it is read from the secret
      # into the environment, and GitHub masks registered secret values in
      # output regardless.
      #
      # `--yes` is explicit on purpose. `db push` prompts "[Y/n]" before
      # applying; on a non-interactive runner it receives no input and proceeds
      # on its default. That worked, but it is undocumented behaviour being
      # relied on for a Do-Not-Vibe operation against a shared database — the
      # kind of thing that changes in a CLI release and is noticed by a
      # migration silently not applying. Answering the question is free.
      - name: Apply migrations to staging
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: supabase db push --db-url "$STAGING_DATABASE_URL" --include-all --yes

  # ── Deploy to staging (ADR-024 as amended 2026-08-15, ADR-034) ─────────────
  #
  # ══ THE DEPLOY IS PULLED BY CI, NOT PUSHED BY RENDER ══════════════════════
  #
  # `render.yaml` sets `autoDeployTrigger: off`, and this job is why. **Do not
  # "fix" a stalled deploy by turning auto-deploy back on in the dashboard** —
  # that is not a shortcut to the same outcome, it is a different and worse one.
  #
  # ADR-034 requires migrations to be applied before the deploy, by the same
  # pipeline, in that order. Its reasoning: migrate-first means new code never
  # runs against an old schema, which for anything but an additive migration is
  # a guaranteed window of errors. Render's own commit hook cannot honour that
  # — it fires on the push, in parallel with `migrate-staging`, and whichever
  # finishes first wins. `checksPass` is no better: it waits for CI to be green
  # but knows nothing about whether THIS commit's migration reached staging.
  #
  # So the ordering is expressed the only way it can be guaranteed: one system
  # doing both things in sequence, with `needs:` as the guarantee.
  deploy-staging:
    name: deploy-staging
    # Push to `main` only. A pull request must never deploy: ADR-023 makes
    # staging a shared environment, and a PR deploying over it would take it
    # away from whatever it was being used for.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # `migrate-staging` is the one that matters. `verify` and `contracts` are
    # already its own prerequisites, and are named again so this job's
    # requirements are readable without following the chain.
    needs: [verify, contracts, migrate-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── Trigger ───────────────────────────────────────────────────────────
      #
      # Through Render's API rather than a deploy hook. **One credential, not
      # two**: the job authenticates to trigger with exactly the same key it
      # authenticates to poll with, so there is one secret to rotate and one
      # thing to get wrong.
      #
      # A deploy hook would also work, but it is a second secret that is itself
      # a bearer credential — anyone holding the URL can deploy — and it cannot
      # report an outcome, so the API key would be needed anyway to find out
      # whether the deploy worked. Two secrets where one does the whole job.
      - name: Trigger the deploy
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          response=$(curl --silent --show-error --fail-with-body             --request POST             --header "Authorization: Bearer $RENDER_API_KEY"             --header 'Content-Type: application/json'             --header 'Accept: application/json'             --data '{}'             "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")

          deploy_id=$(printf '%s' "$response" | jq -r '.id // empty')

          if [ -z "$deploy_id" ]; then
            echo "::error::Render accepted the request but returned no deploy id, so this run cannot verify its own deploy."
            exit 1
          fi

          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Triggered deploy $deploy_id"

      # ── Wait for the result ───────────────────────────────────────────────
      #
      # ══ A JOB THAT FIRES A WEBHOOK AND EXITS IS NOT A DEPLOY GATE ════════
      #
      # It reports that a request was accepted, not that anything was deployed.
      # A build that fails to compile, a container that crashes on boot, a
      # health check that never passes — every one of those leaves the webhook
      # call green and staging running the previous image, and the first person
      # to find out is whoever tries to use it.
      #
      # So this polls the deploy to a terminal state and fails on anything that
      # is not `live`.
      - name: Wait for the deploy to finish
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          set -euo pipefail

          # Terminal statuses, from Render's API reference (read 2026-08-15).
          # The full enumeration is: created, queued, build_in_progress,
          # update_in_progress, live, deactivated, build_failed, update_failed,
          # canceled, pre_deploy_in_progress, pre_deploy_failed.
          #
          # Anything not listed as terminal here is treated as still running,
          # so a status Render adds later stalls this job until the timeout
          # rather than being silently read as success.
          deadline=$(( SECONDS + 900 ))

          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(curl --silent --show-error --fail-with-body \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header 'Accept: application/json' \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              | jq -r '.status')

            echo "deploy $DEPLOY_ID: $status"

            case "$status" in
              live)
                echo "::notice::Deploy $DEPLOY_ID is live."
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Deploy $DEPLOY_ID finished as '$status'. Staging is still running the previous image. The build log is in the Render dashboard under this service's Events."
                exit 1
                ;;
            esac

            sleep 10
          done

          # A timeout is a failure, not an unknown. Fifteen minutes is far
          # longer than this image takes to build, so reaching here means
          # something is wrong even if Render has not said so yet.
          echo "::error::Deploy $DEPLOY_ID did not reach a terminal state within 15 minutes."
          exit 1

  # ── Smoke-test the deployed staging service ───────────────────────────────
  #
  # `DEFINITION_OF_DONE.md`: "Deployed to staging and smoke-tested there, not
  # only locally." This is the only job in the pipeline that touches the
  # DEPLOYED ARTEFACT rather than the source it was built from — everything
  # above proves the code is correct; this proves the thing that is running is.
  #
  # **It is not the e2e test.** ADR-033 reserves that for Flutter
  # `integration_test` driving a real build, "and nothing else. An API
  # integration test is not an e2e test, however end-to-end it feels."
  # `docs/analysis/09-phase3-close.md` records why that box does not tick in
  # Phase 3.
  #
  # Gated on `deploy-staging`, so it runs against the build this push produced
  # rather than whatever happened to be live.
  smoke-staging:
    name: smoke-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # No credentials. Every assertion uses public endpoints — see the note in
      # the script about why the sign-up probe proves the database is reachable
      # without one, and why giving CI a service-role key to do better would be
      # a poor trade.
      - name: Smoke-test staging
        run: node scripts/smoke-staging.mjs
