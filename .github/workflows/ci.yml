name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      # Version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm --filter web build

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      # Filter inside the job (not with `on.paths`) so the required check still reports success when skipped.
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            db:
              - supabase/**
              - packages/shared/src/database.types.ts

      - if: steps.changes.outputs.db == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      - if: steps.changes.outputs.db == 'true'
        run: supabase db start

      # The acceptance tests count rows, so they run against migrations only.
      - if: steps.changes.outputs.db == 'true'
        run: supabase db reset --local --no-seed

      - if: steps.changes.outputs.db == 'true'
        run: supabase test db

      - name: Check the seed loads
        if: steps.changes.outputs.db == 'true'
        run: supabase db reset --local

      - name: Check generated types are up to date
        if: steps.changes.outputs.db == 'true'
        run: |
          supabase gen types typescript --local > packages/shared/src/database.types.ts
          git diff --exit-code -- packages/shared/src/database.types.ts
