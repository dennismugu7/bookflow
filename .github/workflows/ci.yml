name: CI

# ADR-024: GitHub Actions, one CI system for everything.
#
# SEVEN jobs, all on Ubuntu: `verify` (TypeScript), `mobile` (Dart, including
# the Android build), `contracts`, `migrate-staging`, `deploy-staging`,
# `smoke-staging`, and `e2e-staging` where it exists. None of the first three
# depends on another, so one failure never hides another's result.
#
# There was an eighth, `ios-build` on macOS. ADR-043 removed it — see the note
# where it stood. This comment is the count's only home in this file, so it is
# the one to update when a job is added or removed.
#
# Still missing from ADR-024: the contract drift check, which needs ADR-025's
# generation pipeline, and the Fly.io deploy, which belongs after there is
# something worth deploying.
#
# ══ THIRD-PARTY ACTIONS ARE PINNED TO COMMIT SHAs ═══════════════════════════
#
# `@v2` is a tag, and a tag is a pointer its owner can move. `supabase/setup-cli@v1`
# is not even a tag — it is a BRANCH, which is more mutable still.
#
# **This runner holds the staging database credentials.** `migrate-staging` is
# handed `STAGING_DATABASE_URL`, the privileged `postgres` connection with DDL
# rights over the whole schema (ADR-038). An action that silently changed under
# a tag would be running with that in its environment, and the diff a reviewer
# sees would be empty — because nothing in this repository changed.
#
# So every third-party action names a full commit SHA, with the version in a
# trailing comment so a human can still read what it is. Dependabot understands
# this form and will propose SHA bumps with the comment updated.
#
# ── `actions/*` STAY ON TAGS, AND THAT IS A DECISION ───────────────────────
#
# `actions/checkout`, `actions/setup-node` and `actions/setup-java` are
# published by GitHub. Pinning them would protect against nothing that is not
# already lost: **GitHub is the trust root for the whole run regardless** — it
# supplies the runner image, stores the secrets, serves this workflow file, and
# executes it. An attacker who can move `actions/checkout@v4` can equally serve
# a modified runner or read the secrets directly, and a SHA in this file stops
# none of that.
#
# The third-party actions are different in exactly the way that matters: they
# are separate trust roots, each an independent account whose compromise is
# survivable-in-principle and would otherwise reach our credentials.
#
# Pinning them too would cost real upkeep — a `checkout` security patch would
# wait for somebody to notice — for a threat model where the loss has already
# happened. Stated rather than left implicit, so the asymmetry reads as a
# choice and not as an oversight.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the iOS job be run on demand against a branch, without paying for it
  # on every push. See the `ios` job's `if:` below.
  workflow_dispatch:

# One run per ref. Pushing twice in quick succession cancels the first, so the
# queue never fills with runs whose result nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # node-version-file, not a literal. The Node line is pinned in .nvmrc and
      # in package.json engines (ADR-022); a third copy here would be the one
      # that silently goes stale.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # ci, not install: the lockfile is authoritative and a CI run must never
      # quietly resolve a different tree than the one that was reviewed.
      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        # Pinned to a commit — see the note at the top of this file. `v1` here
        # is a BRANCH, not a tag, which is the most mutable form of all.
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.113.0

      # A real Supabase Postgres, not a stock postgres service container.
      # The schema will shortly reference Supabase's own `auth` schema, which
      # stock Postgres does not have — so the integration suite has to run
      # against the same stack it runs against locally, or it stops being
      # evidence about anything.
      #
      # Excluded services, and why: every one of these is unused by the test
      # suite, which speaks SQL to Postgres through Kysely and nothing else.
      #   postgrest     ADR-013: clients never talk to PostgREST
      #   storage-api   ADR-011's buckets are not exercised yet
      #   imgproxy      image transforms, only meaningful with storage
      #   realtime      no subscription is under test
      #   postgres-meta \
      #   studio         > the dashboard; there is nobody to look at it
      #   edge-runtime  no edge functions in this project
      #   logflare      \
      #   vector         > log shipping, pointless for a 20-second run
      #   supavisor     connection pooler; tests connect directly on 54322
      #
      # `gotrue` is deliberately NOT excluded. It owns the `auth` schema, and
      # dropping it would remove the one thing that makes this stack worth
      # starting instead of a plain Postgres container.
      #
      # `kong` is no longer excluded either, as of the auth slice. GoTrue is
      # only reachable over HTTP through the gateway, and the integration tests
      # sign the seeded user in for a real ES256 token rather than minting one
      # against keys they control (ADR-017, spike 001/C5). Excluding kong makes
      # those tests fail with a connection error that looks like a bug in the
      # API.
      #
      # `mailpit` is no longer excluded either, as of the mediated sign-up
      # slice. It was excluded on the reasoning that ADR-012 sends domain email
      # through the outbox worker — true, and beside the point: ADR-027 puts
      # AUTH email inside GoTrue, and ADR-037's mechanism ends in a real
      # `POST /resend` that GoTrue must actually deliver somewhere. With no SMTP
      # target that call fails, the endpoint compensates exactly as designed,
      # and the happy-path test fails for a reason that has nothing to do with
      # the code under test.
      #
      # `supabase start` applies everything in supabase/migrations as part of
      # bringing the database up, so the schema is in place before the suite
      # runs. The step after this one asserts that rather than assuming it.
      - name: Start Supabase (database, auth and mail)
        run: |
          supabase start \
            -x postgrest \
            -x storage-api \
            -x imgproxy \
            -x realtime \
            -x postgres-meta \
            -x studio \
            -x edge-runtime \
            -x logflare \
            -x vector \
            -x supavisor

      - name: Confirm migrations applied
        run: supabase migration list --local

      # One command, the same one DEFINITION_OF_DONE.md names. Not a re-listing
      # of lint/format/typecheck/test steps: separate steps here would be a
      # second definition of "done" that drifts from the checklist the moment
      # either changes.
      #
      # Neither value below is a secret. They are the fixed, well-known local
      # development values the Supabase CLI prints on every machine — see
      # docs/ENVIRONMENT.md §3. No repository secret is used by this workflow.
      # Two connections, per ADR-038. DATABASE_URL is the application role —
      # CRUD, no DDL — and is what apps/api actually uses. ADMIN_DATABASE_URL is
      # postgres, for the test harness alone: it creates auth.users rows and
      # switches roles, neither of which the application role can do.
      #
      # The application role's local password is set by supabase/seed.sql, which
      # `supabase start` applies. That is the only reason this works without a
      # secret — and it is the reason seed.sql must never stop being local-only.
      - name: Verify
        run: npm run verify
        env:
          APP_ENV: local
          DATABASE_URL: postgresql://bookflow_api:local_dev_password@127.0.0.1:54322/postgres
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          # The issuer and JWKS URI are derived from this (ADR-017). The anon
          # key below is the fixed local development value the CLI prints on
          # every machine — not a secret, and not a repository secret.
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          # Required as of the mediated sign-up slice (ADR-037): the API creates
          # and deletes GoTrue users with it. This is the fixed local
          # development service-role key the CLI prints on every machine — the
          # same class of value as the anon key above, and equally not a secret.
          # A hosted service-role key would never appear here; it bypasses RLS
          # entirely (spike 001/C7) and lives only in Fly/Actions secrets.
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

  # ── Mobile ─────────────────────────────────────────────────────────────────
  # Independent of `verify`. Neither job needs the other, so a Dart failure
  # does not hide a TypeScript failure, and both results arrive on the PR.
  mobile:
    name: mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle needs a JDK; the Flutter action does not supply one.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to the version on the development machine, for the same reason
      # the Supabase CLI is pinned above: CI and local should disagree because
      # someone changed a number, not because a channel moved.
      - name: Set up Flutter
        # Pinned to a commit — see the note at the top of this file.
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # --fatal-infos matters: every lint in analysis_options.yaml reports as an
      # "info", and without this the analyzer would exit zero with a page of
      # them (ADR-022 requires zero warnings).
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Format check
        run: dart format --set-exit-if-changed lib test

      # `--exclude-tags golden` is deliberate and is not a gap in coverage.
      #
      # The one tagged test renders screen #20 to a PNG under
      # docs/designs/built/ so it can be compared BY EYE against its design. It
      # is an artefact, not an assertion: font hinting and subpixel positioning
      # differ between the Windows development machine and this runner, so a
      # byte comparison of rendered text fails here for reasons that have
      # nothing to do with the screen. The predictable response to that is
      # `--update-goldens` until the build is green, which teaches people to
      # regenerate the reference instead of looking at it.
      #
      # The screen's behaviour IS covered here — test/profile_screen_test.dart
      # asserts on widgets and text and runs in this job.
      - name: Test
        run: flutter test --exclude-tags golden

      - name: Build Android (debug)
        run: flutter build apk --debug

  # ── iOS — REMOVED by ADR-043 ───────────────────────────────────────────────
  # There was an `ios-build` job here: `flutter build ios --no-codesign` on
  # macos-latest, the repository's only 10x runner.
  #
  # ADR-043 makes Android the v1 platform target and puts iOS out of scope, on
  # the finding that NO ADR EVER NAMED iOS AS A TARGET — ADR-015 chose Flutter
  # and stated how iOS would be built if built; ADR-005 says "Kenya only for
  # v1" and names no platform; the design documents contain zero matches for
  # iOS, Android, App Store or Play Store. The job existed because
  # `flutter create` makes an ios/ directory.
  #
  # This note is left rather than the lines simply deleted: a job vanishing from
  # a workflow reads as an accident, and the next person to wonder where the iOS
  # build went should find the answer here rather than in the log.
  #
  # `apps/mobile/ios/` REMAINS and is not built. Its presence is scaffolding,
  # not support. Reversing costs `flutter create --platforms=ios` plus whatever
  # plugin configuration is then needed — the same as it would cost today.

  # ── Contract drift ─────────────────────────────────────────────────────────
  # Its own job rather than a step inside `verify`, for two reasons.
  #
  # First, it needs a different toolchain: Node to build the app, Docker to run
  # openapi-generator, and the Dart SDK to run build_runner. Folding that into
  # `verify` would make the fast pre-push gate depend on all three.
  #
  # Second, a drift failure should read as "the contract drifted", not as a
  # late step in a job named after something else. Independent jobs also mean a
  # drift failure never hides a test failure or vice versa.
  #
  # This is the job ADR-014 leans on. Without it, "the spec is generated from
  # code" and "hand-written Dart models are prohibited" are conventions rather
  # than guarantees.
  # ── Web ────────────────────────────────────────────────────────────────────
  #
  # A job of its own rather than steps appended to `verify`, for the reason
  # `mobile` is separate: independent failures arrive independently, so a broken
  # React component does not hide a broken query, and both results land on the
  # PR at once.
  #
  # It also has nothing `verify` has. `verify` spends most of its wall clock
  # starting a Supabase stack — a database, GoTrue, Kong, Mailpit — and this
  # builds a static site that talks to no one at build time. Bolting it on would
  # make a 30-second job wait several minutes for a database it never opens.
  #
  # **Lint is deliberately NOT repeated here.** `npm run lint` in `verify`
  # already covers `apps/web` — eslint.config.js resolves the whole repository —
  # and a second invocation would be a second place the rule set could be
  # configured differently from the one the checklist names.
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The build script is `tsc --noEmit && vite build`, so typecheck and
      # bundle are one step by construction — a build that emits cannot have
      # skipped the typecheck.
      #
      # No VITE_API_BASE_URL is set: this run proves the committed default
      # produces a working build, which is the configuration a developer gets
      # from a fresh clone and the one most likely to be wrong unnoticed.
      - name: Typecheck and build
        run: npm run web:build

      - name: Test
        run: npm run web:test

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Flutter
        # Pinned to a commit — see the note at the top of this file.
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get
        working-directory: apps/mobile

      # Regenerates the spec and the Dart client, then fails if either differs
      # from what is committed — including a generated file nobody committed at
      # all. openapi-generator runs as a container; the runner already has
      # Docker, and a JDK is not part of this project's toolchain (ADR-022).
      - name: Check for contract drift
        run: npm run contracts:check

  # ── Staging migrations ─────────────────────────────────────────────────────
  # ADR-034: migrations are applied by CI on merge to `main`, before any deploy
  # step, using a scoped credential held in Actions secrets — never from a
  # development machine. ADR-023's rule that no hosted credential lives on a
  # laptop is only real if nothing requires one to be there.
  #
  # `if` is belt and braces: `on.push.branches` already restricts pushes to
  # `main`, and this additionally guarantees the job cannot fire for a
  # pull_request event. A PR must never migrate a shared database — its schema
  # would land before its code was reviewed, and against a branch that may
  # never merge.
  #
  # `needs` means a red test suite or a drifted contract stops the migration.
  # A migration is the one thing here that is not trivially reversible, so it
  # goes last among the checks and first among the changes.
  #
  # The deploy job, when it exists, will declare `needs: [migrate-staging]` so
  # that code expecting a column cannot ship before the column exists. That
  # ordering makes backward-compatible migrations a requirement rather than a
  # preference — see ADR-034.
  migrate-staging:
    name: migrate-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        # Pinned to a commit — see the note at the top of this file. `v1` here
        # is a BRANCH, not a tag, which is the most mutable form of all.
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.113.0

      # Fails the step, and so the workflow, on any migration error. The
      # connection string never appears in the log: it is read from the secret
      # into the environment, and GitHub masks registered secret values in
      # output regardless.
      #
      # `--yes` is explicit on purpose. `db push` prompts "[Y/n]" before
      # applying; on a non-interactive runner it receives no input and proceeds
      # on its default. That worked, but it is undocumented behaviour being
      # relied on for a Do-Not-Vibe operation against a shared database — the
      # kind of thing that changes in a CLI release and is noticed by a
      # migration silently not applying. Answering the question is free.
      - name: Apply migrations to staging
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: supabase db push --db-url "$STAGING_DATABASE_URL" --include-all --yes

  # ── Deploy to staging (ADR-024 as amended 2026-08-15, ADR-034) ─────────────
  #
  # ══ THE DEPLOY IS PULLED BY CI, NOT PUSHED BY RENDER ══════════════════════
  #
  # `render.yaml` sets `autoDeployTrigger: off`, and this job is why. **Do not
  # "fix" a stalled deploy by turning auto-deploy back on in the dashboard** —
  # that is not a shortcut to the same outcome, it is a different and worse one.
  #
  # ADR-034 requires migrations to be applied before the deploy, by the same
  # pipeline, in that order. Its reasoning: migrate-first means new code never
  # runs against an old schema, which for anything but an additive migration is
  # a guaranteed window of errors. Render's own commit hook cannot honour that
  # — it fires on the push, in parallel with `migrate-staging`, and whichever
  # finishes first wins. `checksPass` is no better: it waits for CI to be green
  # but knows nothing about whether THIS commit's migration reached staging.
  #
  # So the ordering is expressed the only way it can be guaranteed: one system
  # doing both things in sequence, with `needs:` as the guarantee.
  deploy-staging:
    name: deploy-staging
    # Push to `main` only. A pull request must never deploy: ADR-023 makes
    # staging a shared environment, and a PR deploying over it would take it
    # away from whatever it was being used for.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # `migrate-staging` is the one that matters. `verify` and `contracts` are
    # already its own prerequisites, and are named again so this job's
    # requirements are readable without following the chain.
    needs: [verify, contracts, migrate-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── Trigger ───────────────────────────────────────────────────────────
      #
      # Through Render's API rather than a deploy hook. **One credential, not
      # two**: the job authenticates to trigger with exactly the same key it
      # authenticates to poll with, so there is one secret to rotate and one
      # thing to get wrong.
      #
      # A deploy hook would also work, but it is a second secret that is itself
      # a bearer credential — anyone holding the URL can deploy — and it cannot
      # report an outcome, so the API key would be needed anyway to find out
      # whether the deploy worked. Two secrets where one does the whole job.
      - name: Trigger the deploy
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          response=$(curl --silent --show-error --fail-with-body             --request POST             --header "Authorization: Bearer $RENDER_API_KEY"             --header 'Content-Type: application/json'             --header 'Accept: application/json'             --data '{}'             "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")

          deploy_id=$(printf '%s' "$response" | jq -r '.id // empty')

          if [ -z "$deploy_id" ]; then
            echo "::error::Render accepted the request but returned no deploy id, so this run cannot verify its own deploy."
            exit 1
          fi

          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Triggered deploy $deploy_id"

      # ── Wait for the result ───────────────────────────────────────────────
      #
      # ══ A JOB THAT FIRES A WEBHOOK AND EXITS IS NOT A DEPLOY GATE ════════
      #
      # It reports that a request was accepted, not that anything was deployed.
      # A build that fails to compile, a container that crashes on boot, a
      # health check that never passes — every one of those leaves the webhook
      # call green and staging running the previous image, and the first person
      # to find out is whoever tries to use it.
      #
      # So this polls the deploy to a terminal state and fails on anything that
      # is not `live`.
      - name: Wait for the deploy to finish
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          set -euo pipefail

          # Terminal statuses, from Render's API reference (read 2026-08-15).
          # The full enumeration is: created, queued, build_in_progress,
          # update_in_progress, live, deactivated, build_failed, update_failed,
          # canceled, pre_deploy_in_progress, pre_deploy_failed.
          #
          # Anything not listed as terminal here is treated as still running,
          # so a status Render adds later stalls this job until the timeout
          # rather than being silently read as success.
          deadline=$(( SECONDS + 900 ))

          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(curl --silent --show-error --fail-with-body \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header 'Accept: application/json' \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              | jq -r '.status')

            echo "deploy $DEPLOY_ID: $status"

            case "$status" in
              live)
                echo "::notice::Deploy $DEPLOY_ID is live."
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Deploy $DEPLOY_ID finished as '$status'. Staging is still running the previous image. The build log is in the Render dashboard under this service's Events."
                exit 1
                ;;
            esac

            sleep 10
          done

          # A timeout is a failure, not an unknown. Fifteen minutes is far
          # longer than this image takes to build, so reaching here means
          # something is wrong even if Render has not said so yet.
          echo "::error::Deploy $DEPLOY_ID did not reach a terminal state within 15 minutes."
          exit 1

  # ── Smoke-test the deployed staging service ───────────────────────────────
  #
  # `DEFINITION_OF_DONE.md`: "Deployed to staging and smoke-tested there, not
  # only locally." This is the only job in the pipeline that touches the
  # DEPLOYED ARTEFACT rather than the source it was built from — everything
  # above proves the code is correct; this proves the thing that is running is.
  #
  # **It is not the e2e test.** ADR-033 reserves that for Flutter
  # `integration_test` driving a real build, "and nothing else. An API
  # integration test is not an e2e test, however end-to-end it feels."
  # `docs/analysis/09-phase3-close.md` records why that box does not tick in
  # Phase 3.
  #
  # Gated on `deploy-staging`, so it runs against the build this push produced
  # rather than whatever happened to be live.
  smoke-staging:
    name: smoke-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # No credentials. Every assertion uses public endpoints — see the note in
      # the script about why the sign-up probe proves the database is reachable
      # without one, and why giving CI a service-role key to do better would be
      # a poor trade.
      - name: Smoke-test staging
        run: node scripts/smoke-staging.mjs

  # ── The e2e gate ───────────────────────────────────────────────────────────
  #
  # **This is the job that satisfies DEFINITION_OF_DONE's e2e item**, and the
  # only one that can: ADR-033 reserves that to Flutter `integration_test`
  # driving a real build. `smoke-staging` above is an API-level test and does
  # not tick the box, however end-to-end it feels.
  #
  # Phase 3's critical journey, per ADR-033's 2026-08-15 amendment: a session is
  # injected and screen #20 renders real data from deployed staging.
  #
  # ── WHY IT RUNS WHERE IT DOES ──────────────────────────────────────────────
  #
  # `needs: [deploy-staging]` — the same gate as `smoke-staging`, for the same
  # reason: it must exercise the build THIS push produced, not whatever happened
  # to be live. A PR must never reach staging (ADR-023: shared environment).
  #
  # `workflow_dispatch` is the exception, and it is deliberate. The gate needs to
  # be runnable against a branch — a red proof cannot be performed on `main`, and
  # a change to the test itself cannot be validated by merging it first. On a
  # dispatch run `deploy-staging` is skipped, so this runs against whatever is
  # currently live, which is correct for that purpose and stated here so nobody
  # reads a dispatch result as proof of the branch's deploy.
  e2e-staging:
    name: e2e-staging
    needs: [deploy-staging]
    if: |
      always()
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
      && (needs.deploy-staging.result == 'success'
          || needs.deploy-staging.result == 'skipped')
    runs-on: ubuntu-latest
    # The emulator boot dominates: roughly 4 minutes to a usable device, then
    # the run itself. 30 is generous rather than optimistic — a timeout here
    # reads as a flake and gets ignored, which is worse than a slow job.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        # Pinned to a commit — see the note at the top of this file.
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      # ── The session, minted here so the password never reaches a build ────
      #
      # **`--dart-define-from-file` COMPILES its values into the binary.**
      # Verified rather than assumed: a throwaway password was built locally and
      # recovered from `kernel_blob.bin` with `grep -a`
      # (`docs/analysis/10-e2e-credential-in-artefact.md`). So protecting the
      # file protects the file, not the value.
      #
      # This job therefore performs the password grant ITSELF and passes only
      # the resulting `access_token`, which **expires in one hour** (ADR-017).
      # `E2E_STAGING_PASSWORD` stays in Actions secrets and never enters a
      # build artefact at all.
      #
      # **No refresh token is passed either.** `setSession` needs a non-empty
      # refresh token but never uses it when the access token is unexpired, so
      # the test passes a literal placeholder — meaning the artefact cannot mint
      # itself a new token when the hour is up.
      #
      # Two properties preserved from the earlier arrangement, both still
      # necessary: nothing lands in argv (`jq -n` reads `env.NAME`; `--arg`
      # would have put the value in jq's own command line), and the file is
      # written to `RUNNER_TEMP` rather than the workspace, where no
      # `actions/upload-*` glob can reach it.
      #
      # `--fail-with-body` so a rejected grant is an error rather than a JSON
      # error document quietly written into the defines file, and `-s -S` so
      # curl reports the failure without drawing a progress bar over it.
      - name: Mint a session and compose the defines file
        id: defines
        env:
          E2E_EMAIL: ${{ secrets.E2E_STAGING_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_STAGING_PASSWORD }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          API_BASE_URL: https://bookflow-api-staging-gabm.onrender.com
        run: |
          set -euo pipefail
          for name in E2E_EMAIL E2E_PASSWORD SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is empty — see docs/ENVIRONMENT.md §3"
              exit 1
            fi
          done

          # The password reaches curl through a FILE on stdin, not through -d
          # on the command line, for the same argv reason as everything else.
          jq -n '{email: env.E2E_EMAIL, password: env.E2E_PASSWORD}' \
            > "$RUNNER_TEMP/grant.json"
          chmod 600 "$RUNNER_TEMP/grant.json"

          curl -s -S --fail-with-body \
            -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H 'content-type: application/json' \
            --data-binary "@$RUNNER_TEMP/grant.json" \
            -o "$RUNNER_TEMP/session.json"
          rm -f "$RUNNER_TEMP/grant.json"

          ACCESS_TOKEN="$(jq -r '.access_token // empty' "$RUNNER_TEMP/session.json")"
          rm -f "$RUNNER_TEMP/session.json"
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::the password grant returned no access_token — rotate E2E_STAGING_PASSWORD (docs/ENVIRONMENT.md §3)"
            exit 1
          fi
          # Masked so no later step can print it, deliberately or by accident.
          echo "::add-mask::$ACCESS_TOKEN"

          ACCESS_TOKEN="$ACCESS_TOKEN" jq -n '{
            E2E_EMAIL: env.E2E_EMAIL,
            E2E_ACCESS_TOKEN: env.ACCESS_TOKEN,
            SUPABASE_URL: env.SUPABASE_URL,
            SUPABASE_ANON_KEY: env.SUPABASE_ANON_KEY,
            API_BASE_URL: env.API_BASE_URL
          }' > "$RUNNER_TEMP/e2e-defines.json"
          chmod 600 "$RUNNER_TEMP/e2e-defines.json"
          echo "path=$RUNNER_TEMP/e2e-defines.json" >> "$GITHUB_OUTPUT"

          # ── The id the cleanup step will delete by ──────────────────────────
          #
          # Taken from THIS token's `sub` claim — the account the test will
          # actually sign in as — rather than written as a literal. The delete
          # then cannot target an account other than the one under test, and a
          # garbage secret produces a failed grant above and no delete at all,
          # instead of a successful delete on a row nobody meant to touch.
          #
          # A `sub` is a user id, not a secret: `docs/ENVIRONMENT.md` §3 prints
          # both staging ids in full. It is NOT masked, deliberately — masking it
          # would make the cleanup step's own output unreadable.
          #
          # base64url -> base64, padded, because JWT payloads are unpadded and
          # `base64 -d` refuses them.
          PAYLOAD="$(echo "$ACCESS_TOKEN" | cut -d. -f2 | tr '_-' '/+')"
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="$PAYLOAD==" ;;
            3) PAYLOAD="$PAYLOAD=" ;;
          esac
          E2E_USER_ID="$(echo "$PAYLOAD" | base64 -d 2>/dev/null | jq -r '.sub // empty')"
          echo "user_id=$E2E_USER_ID" >> "$GITHUB_OUTPUT"

      # ── The SECOND account, and why this is not one grant with two uses ────
      #
      # The two e2e tests run as DIFFERENT accounts and must:
      #
      #   profile_e2e_test.dart       e2e-owner@bookflow.test           9b5bdc22…
      #   business_setup_e2e_test.dart  e2e-owner-business@bookflow.test  e508f672…
      #
      # **K78 forbids ever giving the first account a membership.** Running the
      # business journey on its token would create one — which is exactly the
      # rule the cleanup step's guard 2 exists to catch, and it did: wiring the
      # business test to the existing defines file made that guard fail, because
      # the `sub` in that token is 9b5bdc22 and the cleanup expects e508f672.
      #
      # So: a second grant, a second defines file, a second `sub`. Identical in
      # shape to the step above, deliberately — the alternative was
      # parameterising one step over two accounts, which couples the two tests
      # in exactly the property that must differ between them.
      - name: Mint the business account's session
        id: business
        env:
          E2E_EMAIL: ${{ secrets.E2E_BUSINESS_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_BUSINESS_PASSWORD }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          API_BASE_URL: https://bookflow-api-staging-gabm.onrender.com
        run: |
          set -euo pipefail
          for name in E2E_EMAIL E2E_PASSWORD SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is empty — see docs/ENVIRONMENT.md §3"
              exit 1
            fi
          done

          jq -n '{email: env.E2E_EMAIL, password: env.E2E_PASSWORD}' \
            > "$RUNNER_TEMP/business-grant.json"
          chmod 600 "$RUNNER_TEMP/business-grant.json"

          curl -s -S --fail-with-body \
            -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H 'content-type: application/json' \
            --data-binary "@$RUNNER_TEMP/business-grant.json" \
            -o "$RUNNER_TEMP/business-session.json"
          rm -f "$RUNNER_TEMP/business-grant.json"

          ACCESS_TOKEN="$(jq -r '.access_token // empty' "$RUNNER_TEMP/business-session.json")"
          rm -f "$RUNNER_TEMP/business-session.json"
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::the business account's password grant returned no access_token — rotate E2E_BUSINESS_PASSWORD (docs/ENVIRONMENT.md §3)"
            exit 1
          fi
          echo "::add-mask::$ACCESS_TOKEN"

          ACCESS_TOKEN="$ACCESS_TOKEN" jq -n '{
            E2E_EMAIL: env.E2E_EMAIL,
            E2E_ACCESS_TOKEN: env.ACCESS_TOKEN,
            SUPABASE_URL: env.SUPABASE_URL,
            SUPABASE_ANON_KEY: env.SUPABASE_ANON_KEY,
            API_BASE_URL: env.API_BASE_URL
          }' > "$RUNNER_TEMP/business-defines.json"
          chmod 600 "$RUNNER_TEMP/business-defines.json"
          echo "path=$RUNNER_TEMP/business-defines.json" >> "$GITHUB_OUTPUT"

          PAYLOAD="$(echo "$ACCESS_TOKEN" | cut -d. -f2 | tr '_-' '/+')"
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="$PAYLOAD==" ;;
            3) PAYLOAD="$PAYLOAD=" ;;
          esac
          E2E_USER_ID="$(echo "$PAYLOAD" | base64 -d 2>/dev/null | jq -r '.sub // empty')"
          echo "user_id=$E2E_USER_ID" >> "$GITHUB_OUTPUT"

      # ── Clear this account's business, BEFORE the build ────────────────────
      #
      # `uq_memberships_one_owner_per_user` means creation succeeds exactly once
      # per account, and the staging business account is permanent — E14 makes a
      # per-run account impossible. Without this, run 1 asserts creation and run
      # 2 silently asserts the 409 conflict path under a test name that says
      # creation. A test whose MEANING changes between runs is worse than one
      # that fails.
      #
      # BEFORE, not after: cleanup that runs after a failure does not run. A
      # crashed, cancelled or timed-out run leaves its rows behind, and the next
      # run then inherits them. Pre-cleanup makes the starting state a
      # precondition rather than a hope. The test asserts the clean slate itself
      # (`GET /v1/me/business` must answer 404) rather than trusting this step.
      #
      # STAGING_APP_DATABASE_URL — the `bookflow_api` application role, CRUD and
      # no DDL (ADR-038). NOT the service-role key, which bypasses RLS and
      # reaches `auth.users`: the account must survive and only its rows in
      # `public` are cleared, so a credential whose reach exceeds the operation
      # is how a scoped delete becomes an unscoped one after a later edit. NOT
      # STAGING_DATABASE_URL either — that holds DDL and ADR-034 keeps it for
      # `migrate-staging` alone.
      #
      # DO-NOT-VIBE: this deletes from the two tables the membership scoping rule
      # traverses. The guards below are the reason it is safe, and they are
      # conditions that fail the job, not comments asking for care.
      - name: Clear the e2e business account's rows
        env:
          # Raw, under its own name. The translated value is derived in the
          # script and never becomes an environment variable a later step could
          # inherit and misread.
          STAGING_APP_DATABASE_URL: ${{ secrets.STAGING_APP_DATABASE_URL }}
          # `steps.business`, NOT `steps.defines` — the business account's token,
          # not the profile account's. Pointing this at the wrong grant is the
          # mistake guard 2 below caught when this test was first wired.
          E2E_USER_ID: ${{ steps.business.outputs.user_id }}
          EXPECTED_USER_ID: e508f672-dd11-4150-b686-cc06a525f749
        run: |
          set -euo pipefail

          # GUARD 1 — a derived id that is empty or malformed stops the job
          # before any SQL runs. Without it, the same edit that drops this guard
          # is the edit likely to drop the WHERE clause too, and a bare
          # `delete from public.businesses` clears every business on staging.
          if [ -z "$E2E_USER_ID" ]; then
            echo "::error::could not derive a user id from the access token — no SQL was run"
            exit 1
          fi
          if ! echo "$E2E_USER_ID" \
            | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::derived id is not a uuid — no SQL was run"
            exit 1
          fi

          # GUARD 2 — the derived id must be the account this workflow is meant
          # to clear. Deriving from the token protects against a GARBAGE secret;
          # this protects against a VALID secret pointing at a different
          # account, where derivation alone would happily delete that account's
          # rows and the test would go green having operated on the wrong one.
          # The literal is an assertion, never the delete's target.
          if [ "$E2E_USER_ID" != "$EXPECTED_USER_ID" ]; then
            echo "::error::the session belongs to $E2E_USER_ID, not the e2e business account — no SQL was run. If the account was deliberately changed, update EXPECTED_USER_ID and docs/ENVIRONMENT.md §3 in the same commit."
            exit 1
          fi

          if [ -z "$STAGING_APP_DATABASE_URL" ]; then
            echo "::error::STAGING_APP_DATABASE_URL is empty — see docs/ENVIRONMENT.md §3"
            exit 1
          fi

          # ── TWO PARSERS, ONE STRING: A TRANSLATION, NOT A RELAXATION ────────
          #
          # This secret is read by two libraries that do not agree on the
          # vocabulary, and the reader who knows only one of them will read this
          # substitution as weakening the connection. It is not.
          #
          #   node-postgres — `pg-connection-string` maps `require` to
          #   VERIFY-FULL, so `apps/api` has to say `no-verify` to get
          #   encrypt-without-verify against Supabase's pooler, whose chain is
          #   self-signed. That is K76, and the secret is shaped for it.
          #
          #   libpq — `no-verify` IS NOT A VALUE. Its set is disable, allow,
          #   prefer, require, verify-ca, verify-full, and `require` means
          #   exactly encrypt-without-verify.
          #
          # So `no-verify` and `require` NAME THE SAME POSTURE in the two
          # libraries: TLS on, certificate chain unverified. Substituting one for
          # the other translates between vocabularies and changes nothing about
          # what is negotiated on the wire.
          #
          # THIS IS THE SECOND COLLISION ON THIS ONE STRING. K76 records the
          # first — `pg-connection-string` warns it will adopt libpq's weaker
          # semantics for `require` in its next major, which is a reason not to
          # write `require` on the node side. The string now has two consumers
          # with different parsers, and K76's CA fix will have to satisfy both.
          #
          # Parameter expansion, deliberately: no `sed`, no subshell, no pipe —
          # nothing that puts a credential on a command line or in a process
          # table, and nothing that echoes it.
          DB_URL="${STAGING_APP_DATABASE_URL/sslmode=no-verify/sslmode=require}"

          # GUARD 4 — A SILENT NO-OP IS THE DANGEROUS CASE. The substitution
          # above matches a literal. If the secret is ever rotated to a shape
          # that does not carry `sslmode=no-verify` — a different spelling, the
          # parameter dropped, a query string reordered — the expansion does
          # nothing, quietly, and psql falls back to its DEFAULT of `prefer`.
          # `prefer` accepts an unencrypted connection when the server offers
          # one, so the failure mode is not an error but a downgrade, and the
          # only signal would be that the job still passes.
          #
          # Asserting the POSITIVE — the translated value contains
          # `sslmode=require` — rather than that the substitution changed
          # something, so a secret already written in libpq's vocabulary passes
          # here without a special case.
          case "$DB_URL" in
            *sslmode=require*) ;;
            *)
              echo "::error::the translated connection string does not carry sslmode=require. \
          The substitution matched nothing, which means STAGING_APP_DATABASE_URL no longer \
          contains sslmode=no-verify. psql would fall back to its default of 'prefer' and may \
          connect UNENCRYPTED without saying so, which is why this fails instead. Update the \
          substitution to the secret's new shape — see K76 and docs/ENVIRONMENT.md §3. No SQL \
          was run."
              exit 1
              ;;
          esac

          # ORDER. `memberships` is the only thing tying a business to a user —
          # a business row does not know who owns it (ADR-003). Deleting the
          # membership first orphans the business beyond finding, so the ids are
          # CAPTURED FIRST in a CTE and both deletes happen in one statement.
          #
          # Idempotent: a clean slate deletes zero rows and succeeds. That is a
          # pass, not an error — the desired state is "no business", not "a
          # business was removed".
          #
          # ── IF YOU ARE ABOUT TO REWRITE THIS AS `psql -c`, DO NOT ───────────
          #
          # **psql interpolates `:'uid'` from a script on STDIN and NOT from a
          # `-c` argument.** Verified by running both against a real database,
          # not assumed: the `-c` form fails with `syntax error at or near ":"`.
          #
          # That error is the good case. The dangerous case is the edit that
          # "fixes" it by dropping the variable and inlining the id, or by
          # removing the `where` clause that no longer has a value to compare —
          # **at which point this statement stops being scoped and clears every
          # business on staging.** The heredoc is not a style preference; it is
          # what makes the scoping work at all.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -v uid="$E2E_USER_ID" <<'SQL'
          with owned as (
            select business_id from public.memberships where user_id = :'uid'::uuid
          ),
          dropped_memberships as (
            delete from public.memberships where user_id = :'uid'::uuid returning 1
          )
          delete from public.businesses
           where id in (select business_id from owned);
          SQL

          echo "cleared any business owned by $E2E_USER_ID"

      # ── K83, mitigation 1 ───────────────────────────────────────────────────
      #
      # The AVD's userdata partition needs 7372.80 MB. On run 32271223400 the
      # runner had 6912.73 MB and the emulator died on
      #   FATAL | Not enough space to create userdata partition.
      # 460 MB short. The runner ships large tool caches this job never opens,
      # and reclaiming them moves the margin from "one bad draw from red" to
      # several gigabytes of headroom WITHOUT changing the device under test —
      # which is why this mitigation was taken and a smaller AVD was not.
      #
      # `du` before `rm` so the log carries the real figure rather than an
      # expectation, and `df` on both sides of the deletion so the number that
      # matters — free space where the AVD is created — is the one reported.
      # Every path is `-f`-tolerant: a runner image that stops shipping one of
      # these must not fail the gate.
      - name: Reclaim the disk the emulator needs
        run: |
          set -euo pipefail

          echo "── before ──"
          df -h /home/runner

          for path in \
            /usr/local/lib/android/sdk/ndk \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          do
            if [ -e "$path" ]; then
              echo "removing $(du -sh "$path" 2>/dev/null | cut -f1) at $path"
              sudo rm -rf "$path"
            else
              echo "absent, nothing to remove: $path"
            fi
          done

          echo "── after ──"
          df -h /home/runner

          # The emulator reads this as free space at ~/.android/avd. Assert it
          # here so the requirement is checked ONCE, cheaply, and named — rather
          # than discovered by an emulator that dies and an action that spends
          # the boot timeout polling for a device that will never appear.
          mkdir -p "$HOME/.android"
          avail_mb=$(( $(df -Pk "$HOME/.android" | awk 'NR==2 {print $4}') / 1024 ))
          echo "free at $HOME/.android: ${avail_mb} MB (userdata needs 7373 MB)"
          if [ "$avail_mb" -lt 9000 ]; then
            echo "::error title=Not enough disk for the AVD::${avail_mb} MB free at \
          $HOME/.android. The userdata partition alone needs 7373 MB and this is the \
          condition that killed run 32271223400 (K83). Failing here, before the \
          emulator, so the message names the disk rather than a boot timeout."
            exit 1
          fi

      # The emulator needs KVM, and the runner's default udev rules do not grant
      # it to the unprivileged user the action runs as.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ── K83, mitigation 4 — THE WATCHDOG, AS A FILE ─────────────────────────
      #
      # It lives in a file so the INTERPRETER IS GUARANTEED RATHER THAN HOPED
      # FOR. Run 32282354373 is why: the same script inlined into
      # `pre-emulator-launch-script` was executed by the action as
      # `/usr/bin/sh -c …`, which on this image is dash, and dash answered
      # `set: Illegal option -o pipefail` on line 1. The watchdog never started,
      # the step went red on that alone while both e2e tests passed, and the
      # reporter said "the watchdog wrote nothing" — true, and indistinguishable
      # from a watchdog that ran and had nothing to say.
      #
      # A file also means `bash -n` can check it as the shell that will run it,
      # rather than as the shell whoever wrote it happened to have.
      - name: Write the emulator watchdog
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/emulator-watchdog.sh" <<'WATCHDOG'
          set -uo pipefail

          # ARMED MARKER, WRITTEN FIRST, BEFORE ANYTHING CAN GO WRONG.
          # A guard that cannot tell "never ran" from "ran and was happy" is not
          # a guard, and this file is the difference between the two.
          : > "$RUNNER_TEMP/emulator-watchdog.armed"

          # WHICH PROCESS TO KILL, RESOLVED BY WALKING UP RATHER THAN GUESSING.
          # An earlier version took `ps -o ppid= -p $PPID`, on the belief that
          # $PPID's parent is the action's node process. That was wrong by one
          # level — $PPID IS the node process when the shell is exec'd — and it
          # would have signalled the runner instead. So: walk the ancestry and
          # take the first process whose command line names the action. If none
          # matches, the watchdog still diagnoses and simply does not kill; a
          # missed kill costs minutes, a wrong kill costs the job's meaning.
          find_action_pid() {
            pid=$$
            for _ in 1 2 3 4 5 6; do
              parent=$(ps -o ppid= -p "$pid" 2>/dev/null | tr -d ' ')
              [ -z "$parent" ] && return 1
              if tr '\0' ' ' < "/proc/$parent/cmdline" 2>/dev/null \
                | grep -q 'android-emulator-runner'; then
                echo "$parent"
                return 0
              fi
              pid=$parent
            done
            return 1
          }
          action_pid=$(find_action_pid || true)

          (
            echo "armed: watching for the emulator process (action pid: ${action_pid:-not found})"

            # The emulator does not exist yet; the action launches it the moment
            # this script returns. Wait for it to appear before concluding
            # anything from its absence.
            for _ in $(seq 1 90); do
              [ -n "$(pgrep -f -- '-avd test' || true)" ] && break
              sleep 1
            done

            while :; do
              booted=$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$booted" = "1" ]; then
                echo "stood down: the emulator booted"
                exit 0
              fi
              if [ -z "$(pgrep -f -- '-avd test' || true)" ]; then
                avail_mb=$(( $(df -Pk "$HOME/.android" | awk 'NR==2 {print $4}') / 1024 ))
                {
                  echo "FIRED"
                  echo "### The emulator exited before boot"
                  echo
                  echo "The emulator process is gone and \`sys.boot_completed\` never"
                  echo "returned 1. **This is not a boot timeout** — the emulator failed"
                  echo "and said why. Read the \`FATAL\` line in the emulator step's log;"
                  echo "ignore the \`adb ... device not found\` polling that follows it,"
                  echo "which is this action interrogating a device that no longer exists."
                  echo
                  echo "Free at \`\$HOME/.android\`: **${avail_mb} MB**. The userdata"
                  echo "partition alone needs **7373 MB** — the cause on record for"
                  echo "run 32271223400 (K83)."
                } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
                [ -n "$action_pid" ] && kill -TERM "$action_pid" 2>/dev/null
                exit 1
              fi
              sleep 2
            done
          ) > "$RUNNER_TEMP/emulator-watchdog.log" 2>&1 &
          WATCHDOG

          # Checked with the shell that will run it, which is the whole point of
          # the file existing.
          bash -n "$RUNNER_TEMP/emulator-watchdog.sh"
          echo "watchdog written and syntax-checked under bash"

      - name: Run the e2e gate on an emulator
        # Pinned to a commit — see the note at the top of this file. This one
        # matters most: it runs an emulator and arbitrary scripts in the same
        # job that holds the staging database credentials.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # API 30 on the `default` image, chosen by measurement rather than by
          # picking the newest. The first attempt — API 34, `google_apis` —
          # **never finished booting inside 600s** on the 2-core runner
          # (run 31902042324), which fails the job for a reason that has nothing
          # to do with the app. `default` carries no Play services, which this
          # app does not use, and boots in a fraction of the time.
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_6
          # Generous: a boot timeout reads as a flake and gets ignored, and the
          # cost of waiting is far lower than the cost of a gate nobody trusts.
          emulator-boot-timeout: 900
          # `-no-snapshot` keeps the boot deterministic: a restored snapshot can
          # carry a stale session in the app's secure storage, and this test's
          # first act is to establish one.
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot -camera-back none
          # ── K83, mitigation 4 ─────────────────────────────────────────────
          #
          # The action's contract, from its own `action.yml`: this runs "after
          # creating the AVD and before launching the emulator" — the only hook
          # that exists between the two, and the reason a watchdog is possible
          # at all.
          #
          # THE DEFECT THIS FIXES IS THE MESSAGE, NOT ONLY THE MINUTES. On run
          # 32271223400 the emulator died 58 seconds in and the action then
          # asked `adb ... getprop sys.boot_completed` every two seconds for the
          # full 900-second timeout, each answer `device 'emulator-5554' not
          # found`, and ended on "Timeout waiting for emulator to boot". That
          # sentence is false: nothing timed out. A reader who trusts it goes
          # looking at boot speed, at the runner's cores, at the API level —
          # everywhere except the one line that said what happened.
          #
          # So the watchdog watches the PROCESS, not the port. If the emulator
          # is gone before `sys.boot_completed`, it says so, prints the disk
          # figures that are the known cause, points at the emulator's own FATAL
          # in the log above, and terminates the action instead of letting it
          # spend the remaining timeout interrogating a device that no longer
          # exists. If boot succeeds it exits silently and costs nothing.
          #
          # THE REDIRECT INSIDE IT IS LOAD-BEARING, not tidiness. A backgrounded
          # child inherits this step's stdout, and the action's exec of this
          # script does not return until that descriptor closes — so a watchdog
          # logging normally would deadlock: the action waiting to launch the
          # emulator, the watchdog waiting for an emulator that was never
          # launched. It writes to a file, the diagnosis also goes to the job
          # summary, and the always-run reporter below reads both.
          #
          # `bash`, EXPLICITLY. The action runs this string with `sh -c`, and on
          # the runner image `sh` is dash — see the step above for what that cost
          # and how it hid.
          pre-emulator-launch-script: bash "$RUNNER_TEMP/emulator-watchdog.sh"
          working-directory: apps/mobile
          # `timeout` because a FAILING run does not exit. Measured on run
          # 31902883567: the test reported "0 tests passed, 1 failed" and then
          # sat there until the job's own 30-minute limit killed it — so the
          # gate's verdict was available 17 minutes before anyone could read it.
          # A gate that takes half an hour to say "red" is a gate people turn
          # off. `--preserve-status` keeps the test's own exit code when it does
          # finish, so this bounds the hang without inventing a result.
          # Two tests, two defines files, two accounts — see the business grant
          # step above. Sequential and `&&`-joined: a failure in the first stops
          # the second, and the emulator is booted once for both.
          script: >-
            timeout --preserve-status --signal=KILL 12m
            flutter test integration_test/profile_e2e_test.dart
            --dart-define-from-file=${{ steps.defines.outputs.path }}
            &&
            timeout --preserve-status --signal=KILL 12m
            flutter test integration_test/business_setup_e2e_test.dart
            --dart-define-from-file=${{ steps.business.outputs.path }}

      # The watchdog cannot write to the emulator step's log without deadlocking
      # it (see the redirect above), so its file is emptied into the log here.
      # `always()` because the case it exists for is the case where the step it
      # watched was killed — and a diagnosis that only survives on the happy
      # path is not a diagnosis.
      - name: Say what the emulator watchdog saw
        if: always()
        run: |
          # THREE STATES, BECAUSE TWO OF THEM WERE INDISTINGUISHABLE AND THAT
          # COST A RUN. On 32282354373 this step printed "the watchdog wrote
          # nothing", which was true and useless: the watchdog had not started at
          # all, and the sentence read exactly like a watchdog that started and
          # had nothing to report. The marker file is what separates them.
          if [ ! -f "$RUNNER_TEMP/emulator-watchdog.armed" ]; then
            echo "WATCHDOG: NEVER ARMED — the script did not reach its first line."
            echo "K83 mitigation 4 did not run in this job, whatever else happened."
            echo "Look at the 'Run pre emulator launch script' group for the reason."
          elif grep -q '^FIRED' "$RUNNER_TEMP/emulator-watchdog.log" 2>/dev/null; then
            echo "WATCHDOG: FIRED — it saw the emulator process exit before boot."
            cat "$RUNNER_TEMP/emulator-watchdog.log"
          else
            echo "WATCHDOG: ARMED AND SILENT — it started and had nothing to report."
            cat "$RUNNER_TEMP/emulator-watchdog.log" 2>/dev/null || true
          fi

      # Runs whether the gate passed or failed. A credential left on a runner
      # image is not made safe by the job having succeeded.
      - name: Remove the defines files
        if: always()
        run: rm -f "$RUNNER_TEMP/e2e-defines.json" "$RUNNER_TEMP/business-defines.json"

      # ══ BEFORE ADDING AN ARTIFACT UPLOAD BELOW THIS LINE ════════════════════
      #
      # If you are here to upload a screenshot, a log bundle, an APK or a
      # failure diagnostic — know what is inside the binary first.
      #
      # `--dart-define-from-file` COMPILES its values into the build. Verified,
      # not assumed: a throwaway value was built locally and extracted with
      # `grep -a` (not `strings`, which misses it — a casual scan comes back
      # clean) from:
      #
      #   build/app/intermediates/assets/debug/mergeDebugAssets/flutter_assets/kernel_blob.bin
      #   build/app/intermediates/flutter/debug/flutter_assets/kernel_blob.bin
      #
      # **What is in there now is an access token, not the password.** The step
      # above mints it, it expires in an hour (ADR-017), the test revokes it by
      # signing out, and no refresh token is compiled in — so the artefact
      # cannot renew itself. `E2E_STAGING_PASSWORD` is not in the build at all.
      #
      # That is a bounded exposure rather than no exposure. An artifact uploaded
      # from a run whose test failed BEFORE the sign-out carries a live token
      # for up to an hour, and the job would be green about it.
      #
      # So: uploading from `apps/mobile/build/` is not catastrophic and is still
      # not free. If you need it, prefer a path outside `build/`, and read
      # docs/analysis/10-e2e-credential-in-artefact.md §4 (K78) — which also
      # records why the account is contained (one profile row, no membership, no
      # business, staging only) and the rule that outlives all of this:
      # **this account must never be given a membership.**
