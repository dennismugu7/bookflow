name: CI

# ADR-024: GitHub Actions, one CI system for everything.
#
# Three independent jobs: `verify` (TypeScript), `mobile` (Dart on Linux) and
# `ios-build` (Dart on macOS). None depends on another, so one failure never
# hides another's result.
#
# Still missing from ADR-024: the contract drift check, which needs ADR-025's
# generation pipeline, and the Fly.io deploy, which belongs after there is
# something worth deploying.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the iOS job be run on demand against a branch, without paying for it
  # on every push. See the `ios` job's `if:` below.
  workflow_dispatch:

# One run per ref. Pushing twice in quick succession cancels the first, so the
# queue never fills with runs whose result nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # node-version-file, not a literal. The Node line is pinned in .nvmrc and
      # in package.json engines (ADR-022); a third copy here would be the one
      # that silently goes stale.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # ci, not install: the lockfile is authoritative and a CI run must never
      # quietly resolve a different tree than the one that was reviewed.
      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      # A real Supabase Postgres, not a stock postgres service container.
      # The schema will shortly reference Supabase's own `auth` schema, which
      # stock Postgres does not have — so the integration suite has to run
      # against the same stack it runs against locally, or it stops being
      # evidence about anything.
      #
      # Excluded services, and why: every one of these is unused by the test
      # suite, which speaks SQL to Postgres through Kysely and nothing else.
      #   kong          API gateway — nothing calls the REST surface
      #   postgrest     ADR-013: clients never talk to PostgREST
      #   storage-api   ADR-011's buckets are not exercised yet
      #   imgproxy      image transforms, only meaningful with storage
      #   realtime      no subscription is under test
      #   mailpit       ADR-012 sends via the outbox worker, not in these tests
      #   postgres-meta \
      #   studio         > the dashboard; there is nobody to look at it
      #   edge-runtime  no edge functions in this project
      #   logflare      \
      #   vector         > log shipping, pointless for a 20-second run
      #   supavisor     connection pooler; tests connect directly on 54322
      #
      # `gotrue` is deliberately NOT excluded. It owns the `auth` schema, and
      # dropping it would remove the one thing that makes this stack worth
      # starting instead of a plain Postgres container. Verified: with the
      # exclusions below, `auth` still has its full set of tables.
      #
      # `supabase start` applies everything in supabase/migrations as part of
      # bringing the database up, so the schema is in place before the suite
      # runs. The step after this one asserts that rather than assuming it.
      - name: Start Supabase (database and auth only)
        run: |
          supabase start \
            -x kong \
            -x postgrest \
            -x storage-api \
            -x imgproxy \
            -x realtime \
            -x mailpit \
            -x postgres-meta \
            -x studio \
            -x edge-runtime \
            -x logflare \
            -x vector \
            -x supavisor

      - name: Confirm migrations applied
        run: supabase migration list --local

      # One command, the same one DEFINITION_OF_DONE.md names. Not a re-listing
      # of lint/format/typecheck/test steps: separate steps here would be a
      # second definition of "done" that drifts from the checklist the moment
      # either changes.
      #
      # Neither value below is a secret. They are the fixed, well-known local
      # development values the Supabase CLI prints on every machine — see
      # docs/ENVIRONMENT.md §3. No repository secret is used by this workflow.
      - name: Verify
        run: npm run verify
        env:
          APP_ENV: local
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

  # ── Mobile ─────────────────────────────────────────────────────────────────
  # Independent of `verify`. Neither job needs the other, so a Dart failure
  # does not hide a TypeScript failure, and both results arrive on the PR.
  mobile:
    name: mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle needs a JDK; the Flutter action does not supply one.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to the version on the development machine, for the same reason
      # the Supabase CLI is pinned above: CI and local should disagree because
      # someone changed a number, not because a channel moved.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # --fatal-infos matters: every lint in analysis_options.yaml reports as an
      # "info", and without this the analyzer would exit zero with a page of
      # them (ADR-022 requires zero warnings).
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Format check
        run: dart format --set-exit-if-changed lib test

      - name: Test
        run: flutter test

      - name: Build Android (debug)
        run: flutter build apk --debug

  # ── iOS ────────────────────────────────────────────────────────────────────
  # Proves the iOS target compiles. It cannot do more than that: there is no
  # Apple Developer account, so --no-codesign is the ceiling and signing stays
  # open as K53 in docs/analysis/05-triage.md.
  #
  # COST. macOS runners bill at 10x the Linux rate against this private
  # repository's included allowance, so this job is deliberately NOT run on
  # every push:
  #   - always on push to main, where the result matters;
  #   - on demand via workflow_dispatch;
  #   - on a pull request ONLY when it carries the `ios` label, so a PR that
  #     touches iOS can opt in and everything else pays nothing.
  ios:
    name: ios-build
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ios')
    runs-on: macos-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --no-codesign

  # ── Contract drift ─────────────────────────────────────────────────────────
  # Its own job rather than a step inside `verify`, for two reasons.
  #
  # First, it needs a different toolchain: Node to build the app, Docker to run
  # openapi-generator, and the Dart SDK to run build_runner. Folding that into
  # `verify` would make the fast pre-push gate depend on all three.
  #
  # Second, a drift failure should read as "the contract drifted", not as a
  # late step in a job named after something else. Independent jobs also mean a
  # drift failure never hides a test failure or vice versa.
  #
  # This is the job ADR-014 leans on. Without it, "the spec is generated from
  # code" and "hand-written Dart models are prohibited" are conventions rather
  # than guarantees.
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get
        working-directory: apps/mobile

      # Regenerates the spec and the Dart client, then fails if either differs
      # from what is committed — including a generated file nobody committed at
      # all. openapi-generator runs as a container; the runner already has
      # Docker, and a JDK is not part of this project's toolchain (ADR-022).
      - name: Check for contract drift
        run: npm run contracts:check
