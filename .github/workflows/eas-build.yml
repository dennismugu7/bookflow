name: EAS build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        type: choice
        options: [development, preview]
        default: preview

concurrency:
  group: eas-build-${{ inputs.profile }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/owner
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: pnpm install --frozen-lockfile

      # --no-wait: the build runs on EAS servers; the job only queues it.
      - run: eas build --platform android --profile "$PROFILE" --non-interactive --no-wait
        env:
          PROFILE: ${{ inputs.profile }}
